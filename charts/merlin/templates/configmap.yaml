apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "merlin.fullname" . }}-config
  labels: {{- include "merlin.labels" . | nindent 4 }}
data:
  config.yaml: |
    # Merlin configuration (snake_case keys match internal/config/config.go yaml tags)
    trivy:
      severity_threshold: {{ .Values.merlin.trivy.severityThreshold }}
    base_image:
      allowed_ids: {{ toJson .Values.merlin.baseImage.allowedIDs }}
    {{- with .Values.merlin.imageAge }}
    image_age:
      {{- if hasKey . "enabled" }}
      enabled: {{ .enabled }}
      {{- end }}
      {{- if hasKey . "thresholdDays" }}
      threshold_days: {{ .thresholdDays }}
      {{- end }}
    {{- end }}
    acr:
      registry_template: {{ .Values.merlin.acr.registryTemplate | quote }}
      base_domain: {{ .Values.merlin.acr.baseDomain | quote }}
    tenants:
    {{- range .Values.merlin.tenants }}
      - prefix: {{ .prefix | quote }}
        acr_client_id: {{ .acrClientId | quote }}
        auth:
          issuer: {{ .auth.issuer | quote }}
          audience: {{ .auth.audience | quote }}
          jwks_url: {{ .auth.jwksUrl | quote }}
          tenant_id: {{ .auth.tenantId | quote }}
        {{- with .imageAge }}
        image_age:
          {{- if hasKey . "enabled" }}
          enabled: {{ .enabled }}
          {{- end }}
          {{- if hasKey . "thresholdDays" }}
          threshold_days: {{ .thresholdDays }}
          {{- end }}
        {{- end }}
    {{- end }}
    auth:
      service: {{ .Values.merlin.auth.service | default "merlin" | quote }}
      registry_token_secret: "${REGISTRY_TOKEN_SECRET}"
      registry_token_ttl: {{ .Values.merlin.auth.registryTokenTTL | default "5m" | quote }}
    staging:
      blob_account_url: {{ .Values.merlin.staging.blobAccountURL | quote }}
      blob_container: {{ .Values.merlin.staging.blobContainer | quote }}
      valkey_addr: {{ include "merlin.valkeyAddr" . | quote }}
      scratch_dir: {{ .Values.merlin.staging.scratchDir | quote }}
      scan_pool_size: {{ .Values.merlin.staging.scanPoolSize }}
    audit:
      # NOTE: The clickhouse_dsn contains ${CLICKHOUSE_PASSWORD}, a literal placeholder (NOT expanded by Helm).
      # At runtime, Merlin's config loader (internal/config/config.go) expands environment variables using
      # os.Expand with strict validation. The Deployment injects CLICKHOUSE_PASSWORD from the ESO-synced
      # <fullname>-secrets Secret. If the env var is unset, Merlin fails fast at startup with a clear error,
      # preventing silent misconfiguration. This keeps the password out of the ConfigMap (no secret in git).
      clickhouse_dsn: {{ include "merlin.clickhouseDSN" . | quote }}
      queue_size: {{ .Values.merlin.audit.queueSize }}
    server:
      addr: {{ .Values.merlin.server.addr | quote }}
      metrics_addr: {{ .Values.merlin.server.metricsAddr | quote }}
      dashboard_addr: {{ .Values.merlin.server.dashboardAddr | quote }}
      max_upload_bytes: {{ .Values.merlin.server.maxUploadBytes }}
      gate_timeout: {{ .Values.merlin.server.gateTimeout | quote }}
      shutdown_timeout: {{ .Values.merlin.server.shutdownTimeout | quote }}
      external_url: {{ .Values.merlin.server.externalURL | quote }}
