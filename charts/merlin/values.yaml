image:
  repository: ""   # set in Phase 8 (e.g. <acr>.azurecr.io/merlin)
  tag: ""          # set in Phase 8
  pullPolicy: IfNotPresent
  pullSecrets: []  # names of dockerconfigjson Secrets for a private registry, e.g. [devregistryc3ai]
replicaCount: 2
serviceAccount:
  create: true
  name: merlin
  # AKS Workload Identity client-id of the Entra app/managed identity:
  workloadIdentityClientID: ""   # required in prod values
podLabels:
  azure.workload.identity/use: "true"
service:
  type: ClusterIP
  port: 5000
metrics:
  port: 9090
dashboard:
  # Observability dashboard (on by default). The Service/containerPort are emitted
  # unless merlin.server.dashboardAddr is "off". Port must match dashboardAddr below.
  port: 8080
ingress:
  enabled: true
  className: ""        # e.g. nginx / azure-application-gateway
  host: ""             # e.g. merlin.example.com  (required)
  tlsSecretName: ""    # existing TLS secret OR via cert-manager annotations
  annotations: {}
  # Annotations for the SEPARATE dashboard Ingress (path-routing or dashboardHost
  # mode). Give the :8080 backend its own health probe — path "/", expecting 200 —
  # so it isn't probed with the gate's /v2/-401 settings (which it fails -> 502).
  dashboardAnnotations: {}
  # Dashboard external exposure (its own host — it serves "/" and would collide
  # with the v2 catch-all on a shared host). Empty = cluster-internal only.
  # WARNING: the dashboard has NO app auth; only set this if the host is itself
  # access-controlled (internal ingress, IP allowlist, or an auth proxy).
  dashboardHost: ""          # e.g. merlin-dashboard.internal.example.com
  dashboardTLSSecretName: "" # defaults to tlsSecretName if empty
  # Serve the dashboard on the SAME host as the registry (ingress.host), path-routed:
  # /v2, /token, /reports -> gate (docker push unaffected); everything else -> dashboard.
  # WARNING: no app auth — this exposes vuln posture + push activity on the registry host.
  dashboardPathRouting: false
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
externalSecrets:
  enabled: true
  secretStoreRef:
    name: ""           # ESO SecretStore/ClusterSecretStore name (required)
    kind: ClusterSecretStore
  refreshInterval: 1h
  # keys to sync (remoteKey = key in the external backend):
  data: []             # e.g. [{secretKey: clickhouse-password, remoteKey: merlin-ch-pass}]
merlin:
  # rendered into /etc/merlin/config.yaml
  grype:
    severityThreshold: CRITICAL
    # Per-scan memory bound (GOMEMLIMIT on the grype child, plus a derived
    # RLIMIT_AS backstop). Unset here on purpose: this chart's default
    # resources.limits.memory (2Gi) is already fully committed by the upload
    # budget below (maxUploadBytes x uploadConcurrency = 512Mi x 4), so there is
    # no room left to budget scans against, and a bound that is too tight fails
    # scans instead of preventing OOMKills.
    #
    # To set one, the arithmetic that must close is:
    #   maxUploadBytes x uploadConcurrency          (upload budget)
    # + memoryLimit    x staging.scanPoolSize       (scan budget)
    # < resources.limits.memory                     (with headroom for merlin itself)
    # See values.opsadmin.multiacr.yaml for a worked example on a 10Gi limit.
    # memoryLimit: 2Gi
  baseImage: { allowedIDs: [rhel, wolfi, chainguard] }
  # Image-age gate: rejects images whose OCI config `created` is older than
  # thresholdDays. Omit this block to use the built-in defaults (enabled, 60 days).
  # Set enabled: false to ship the code with the gate OFF. Fail-closed: an image
  # whose `created` cannot be read is rejected. Per-tenant override: add an
  # `imageAge:` block under a tenants[] entry (most-specific wins).
  imageAge: { enabled: true, thresholdDays: 60 }
  # ACR host template + base DNS domain. Each push is routed to a per-tenant ACR
  # by substituting the tenant prefix into registryTemplate (must contain {prefix}).
  acr:
    registryTemplate: "{prefix}acr.azurecr.io"   # required: must contain {prefix}
    baseDomain: ""                                # required: e.g. c3ci.cloud
  # Per-tenant ACR + Entra auth. One entry per DNS subdomain prefix; the ingress
  # exposes <prefix>.<acr.baseDomain> for each. At least one tenant is required.
  tenants: []
    # - prefix: c3dev
    #   acrClientId: ""        # required: AKS workload-identity client ID for this ACR
    #   auth:
    #     issuer: ""           # required: https://sts.windows.net/<tenant-id>/
    #     audience: ""         # required: token audience (ACR client ID or custom)
    #     jwksUrl: ""          # required: https://login.microsoftonline.com/<tenant-id>/discovery/v2.0/keys
    #     tenantId: ""         # required: Entra tenant ID
  # Shared auth: signing secret + token TTL + registry service name (not per-tenant).
  auth: { service: merlin, registryTokenTTL: "5m" }   # registry_token_secret injected via env
  staging:
    blobAccountURL: ""                  # required: https://<acct>.blob.core.windows.net
    blobContainer: merlin-staging
    valkeyAddr: ""                      # defaulted from operator-CR service in helpers if empty
    scratchDir: /tmp/merlin
    scanPoolSize: 4
    # Expiry for per-push staging keys in Valkey. Backstop only: explicit cleanup
    # reclaims them first, but a SIGKILL (OOMKill) skips it and an abandoned push
    # never completes. Must exceed the slowest real push, or an in-flight push
    # loses its staging state and must be re-pushed.
    sessionTTL: "24h"
  audit: { clickhouseDSN: "", queueSize: 1024 }   # DSN defaulted from operator-CR service if empty
  server:
    addr: ":5000"
    metricsAddr: ":9090"
    dashboardAddr: ":8080"   # dashboard on by default; set "off" to disable
    # Upload memory bound. Staging buffers each chunk AND re-reads the accumulated
    # upload on every write, so worst-case resident memory scales with
    # maxUploadBytes x uploadConcurrency. Keep that product well under
    # resources.limits.memory below — 512Mi x 4 was chosen against a 2Gi limit.
    # Raising either knob without raising the limit reintroduces the OOMKill.
    maxUploadBytes: 536870912   # 512 MiB (was 2 GiB)
    uploadConcurrency: 4        # excess uploads queue, then 503 + Retry-After
    gateTimeout: 5m
    # Drain window for in-flight pushes on SIGTERM/rolling restart. Keep it above
    # gateTimeout (so a push in the gate can finish) and at or below
    # terminationGracePeriodSeconds below (so the kubelet does not SIGKILL mid-drain).
    shutdownTimeout: 6m
    externalURL: ""
# Pod shutdown grace: must be >= server.shutdownTimeout (6m = 360s) so the kubelet
# waits for Merlin to drain in-flight pushes before SIGKILL. The default 30s would
# kill the pod mid-push on every rolling restart.
terminationGracePeriodSeconds: 375
# Valkey via Hyperspike valkey-operator (hyperspike.io/v1 Valkey CR).
valkey:
  enabled: true
  nodes: 1                # standalone for first deploy; >1 for HA
  tls: false             # in-cluster; Merlin connects plaintext within the namespace
  anonymousAuth: true    # staging session state is ephemeral; no password needed
  clusterDomain: cluster.local
  prometheus: false      # operator metrics exporter off for first deploy
  serviceMonitor: false  # no Prometheus-Operator ServiceMonitor
  volumePermissions: false
  storage: { size: 8Gi, storageClassName: "" }   # "" = default StorageClass
  # If enabled: false, set merlin.staging.valkeyAddr to an external address.
# ClickHouse via Altinity clickhouse-operator (clickhouse.altinity.com/v1 CHI CR).
clickhouse:
  enabled: true
  user: merlin
  # Name of an existing Secret holding key `clickhouse-password`. Leave empty to use
  # the ESO-synced `<fullname>-secrets` (externalSecrets.enabled). Set this to inject
  # the password env when providing the secret WITHOUT ESO (e.g. manual/sealed-secret).
  passwordSecret: ""
  # password supplied via ESO secret (clickhouse-password key); referenced by
  # k8s_secret_password in the CHI users config — NOT stored in values/ConfigMap.
  shardsCount: 1
  replicasCount: 1
  storage: { dataSize: 20Gi, logSize: 1Gi, storageClassName: "" }
  # If enabled: false, set merlin.audit.clickhouseDSN to an external DSN.
resources:
  requests: { cpu: 500m, memory: 512Mi }
  limits: { cpu: "2", memory: 2Gi }
