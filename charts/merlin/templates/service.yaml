apiVersion: v1
kind: Service
metadata:
  name: {{ include "merlin.fullname" . }}
  # component: gate is on the Service OBJECT (not just its pod selector) so the
  # ServiceMonitor can select this Service alone. The Valkey/ClickHouse operators
  # propagate name+instance onto their own Services, so those two labels do not
  # identify Merlin's gate.
  labels:
    {{- include "merlin.labels" . | nindent 4 }}
    app.kubernetes.io/component: gate
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "merlin.gateSelectorLabels" . | nindent 4 }}
  ports:
    - name: v2
      port: {{ .Values.service.port }}
      targetPort: 5000
      protocol: TCP
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: 9090
      protocol: TCP
    {{- if ne (lower .Values.merlin.server.dashboardAddr) "off" }}
    - name: dashboard
      port: {{ .Values.dashboard.port }}
      targetPort: dashboard
      protocol: TCP
    {{- end }}
